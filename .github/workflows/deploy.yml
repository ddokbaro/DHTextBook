name: deploy-book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install jupyter-book
          # [정답] mystmd 패키지 설치
          npm install -g mystmd

      # --- 👇 [추가] PDF 한글 깨짐 방지를 위한 폰트 설치 ---
      - name: Install Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -fv
      # --------------------------------------------------------

      - name: Build the book
        run: |
          export BASE_URL="/DHTextBook"
          myst build             # 1. 먼저 myst.yml에 정의된 PDF(Typst)를 굽습니다.
          myst build --html      # 2. 완성된 PDF를 포함하여 최종 HTML 웹사이트를 _build/html에 생성합니다.
      # --------------------------------------------------------

# [원상 복구] 다시 html 폴더에 방패를 만듭니다!
      - name: Disable Jekyll
        run: |
          touch _build/html/.nojekyll

      # [원상 복구] 업로드 경로도 html로 되돌립니다!
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4