name: deploy-book

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      # Github Page 배포 결과 URL
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Typst 엔진 설치 (PDF 변환용)
      - name: Set up Typst
        uses: typst-community/setup-typst@v3

      # [필수] 한글 깨짐 방지를 위한 폰트 설치 (Noto CJK)
      - name: Install system dependencies (fonts, fontconfig)
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig fonts-noto-cjk

      # [선택] D2Coding 폰트 설치 (저장소 fonts 폴더에 파일이 없으면 에러 없이 자동 스킵됨)
      - name: Install D2Coding font (from repo)
        run: |
          if ls fonts/D2Coding* 1> /dev/null 2>&1; then
            mkdir -p ~/.local/share/fonts
            cp -v fonts/D2Coding* ~/.local/share/fonts/
            fc-cache -f -v
          else
            echo "No D2Coding font files found in ./fonts (skip)"
          fi

      # 필수 패키지 설치
      - name: Install dependencies
        run: |
          npm install -g mystmd
          pip install jupyter-book jupytext

      # 1. PDF만 먼저 굽기
      - name: Build PDF exports
        run: |
          myst build --pdf

      # 2. HTML(웹사이트) 굽기
      - name: Build the book
        run: |
          export BASE_URL="/DHTextBook"  # ⚠️ 현재 작업 중이신 저장소 이름과 정확히 일치하는지 확인해 주세요.
          myst build --html

      # 3. [가장 핵심!!!] 만들어진 PDF를 웹사이트 배포 폴더(_build/html/exports)로 이사시키기
      - name: Check PDF build output
        run: |
          echo "Listing files in exports directory:"
          ls -R exports
      - name: Copy exports into HTML build
        run: |
          if [ -d exports ]; then
            mkdir -p _build/html/exports
            cp -v exports/*.pdf _build/html/exports/
          fi

      # Github Page의 Jekyll(기본 정적 사이트 빌더) 규칙 미사용 처리
      - name: Disable Jekyll
        run: |
          touch _build/html/.nojekyll

      # 배포할 폴더 지정
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

      # 최종 배포
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4