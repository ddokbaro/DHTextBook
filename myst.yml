version: 1
project:
  id: dh-textbook
  title: "디지털 인문학 교과서"
  description: 이론에서 구현까지, 인문학도를 위한 통합 가이드
  github: https://github.com/ddokbaro/DHTextBook

  # PDF export 설정
  exports:
    - id: dh-textbook-pdf
      format: typst
      output: exports/dh-textbook.pdf
      fontstyle: "Noto Sans CJK KR"
      fontsize: 10
      linespacing: 1.25
      show_ToC: true

  # PDF 다운로드 항목
  downloads:
    - id: dh-textbook-pdf
      title: "PDF 다운로드"
      filename: "dh-textbook.pdf"

  # ==========================================
  # [목차 구조]
  # ==========================================
  toc:
    - file: intro.md

    - title: "Part 1. 디지털 인문학의 지평"
      children:
        - file: content/theory/dh_history.md
        - file: content/theory/methodology_shift.md
        - file: content/theory/critical_dh.md

    - title: "Part 2. 컴퓨팅과 네트워크"
      children:
        # [첫 번째 주제: 컴퓨팅의 역사와 철학]
        - file: content/computing/history_overview.md
          children:
            - file: content/computing/turing_machine.md
            - file: content/computing/von_neumann.md
            - file: content/computing/moores_law.md

        # [두 번째 주제: 현대 하드웨어의 구조와 진화]
        - file: content/computing/hardware_overview.md
          children:
            - file: content/computing/logic_and_bit.md
            - file: content/computing/storage.md
            - file: content/computing/gpu.md
            - file: content/computing/io_interface.md

        # [세 번째 주제: 연결의 확장]
        - file: content/computing/network_protocols.md

    - title: "Part 3. 문자의 디지털 재현" #키보드와 같은 입력 장치도 같이 다루어야.
      children:
        - file: content/encoding/ascii_history.md
        - file: content/encoding/korean_encoding.md
        - file: content/encoding/unicode_utf8.md

    - title: "Part 4. 비정형 텍스트: 정규표현식"
      children:
        - file: content/regex/plain_text.md
        - file: content/regex/regex_basic.md
        - file: content/regex/regex_advanced.md

    - title: "Part 5. 전자문서와 하이퍼텍스트: XML과 TEI"
      children:
        - file: content/xml/xml_fundamentals.md
        - file: content/xml/tei_guidelines.md
        - file: content/xml/digital_archives_practice.md

    - title: "Part 6. 구조적 데이터: RDB와 SQL"
      children:
        - file: content/rdb/tabular_data.md
        - file: content/rdb/rdb_concept.md
        - file: content/rdb/sql_basic_and_advanced.md

    - title: "Part 7. 의미와 연결: 시맨틱 웹과 RDF"
      children:
        - file: content/rdf/semantic_web.md
        - file: content/rdf/ontology_design.md
        - file: content/rdf/korean_studies_lod.md

    - title: "Part 8. 기초 통계와 데이터 탐색"
      children:
        - file: content/stats/descriptive_statistics.md
        - file: content/stats/probability_distributions.md
        - file: content/stats/eda_with_python.md

    - title: "Part 9. 텍스트 마이닝과 자연어 처리"
      children:
        - file: content/text_mining/text_mining_flow.md
        - file: content/text_mining/morphological_analysis.md
        - file: content/text_mining/topic_modeling.md

    - title: "Part 10. 지식 네트워크와 관계망 분석 (SNA)"
      children:
        - file: content/network/network_theory_basics.md
        - file: content/network/centrality_and_community.md
        - file: content/network/sna_practice.md

    - title: "Part 11. 공간 인문학과 GIS"
      children:
        - file: content/spatial/gis_fundamentals.md
        - file: content/spatial/spatial_data_mapping.md
        - file: content/spatial/historical_gis_cases.md

    - title: "Part 12. 정보 시각화의 원리"
      children:
        - file: content/visualization/efficient_info_vis.md
        - file: content/visualization/python_dataviz_tools.md
        - file: content/visualization/network_and_spatial_vis.md

    - title: "Part 13. 다차원 매체의 활용"
      children:
