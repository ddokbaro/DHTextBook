        - file: content/multimedia/drone_photogrammetry.md

    - title: "Part 14. 인공지능 패러다임과 딥러닝"
      children:
        - file: content/ai_basics/ai_paradigm.md
        - file: content/ai_basics/deep_learning_architecture.md

    - title: "Part 15. 생성형 AI와 거대언어모델 (LLM)"
      children:
        - file: content/llm/gen_ai_mechanisms.md
        - file: content/llm/open_source_llm.md

    - title: "Part 16. 인문학도를 위한 프롬프트 엔지니어링"
      children:
        - file: content/prompting/prompt_design_principles.md
        - file: content/prompting/few_shot_and_cot.md

    - title: "Part 17. 인공지능 실전 응용"
      children:
        - file: content/ai_application/ai_for_literature_and_emotion.md
        - file: content/ai_application/distant_reading_techniques.md
        - file: content/ai_application/graph_rag.md

    - title: "Part 18. 지속 가능한 연구 인프라"
      children:
        - file: content/infra/cli_linux.md
        - file: content/infra/git_github.md
        - file: content/infra/myst_syntax_guide.md
        - file: content/infra/publish_environment.md

# ==========================================
# [사이트 디자인 및 추가 기능 설정]
# ==========================================
site:
  template: book-theme
  logo: logo.png
  actions:
    - title: Open in Colab
      icon: rocket
      url: https://colab.research.google.com/github/ddokbaro/DHTextBook/blob/main/
      static: true
  options:
    numbered_chapters: true