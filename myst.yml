  github: https://github.com/ddokbaro/DHTextBook

  # PDF export 설정
  exports:
    - id: dh-textbook-pdf
      format: typst
      output: exports/dh-textbook.pdf
      fontstyle: "Noto Sans CJK KR"
      fontsize: 10
      linespacing: 1.25
      show_ToC: true

  # PDF 다운로드 항목
  downloads:
    - id: dh-textbook-pdf
      title: "PDF 다운로드"
      filename: "dh-textbook.pdf"

