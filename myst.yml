version: 1
project:
  id: dh-textbook
  title: "디지털 인문학 교과서"
  description: 이론에서 구현까지, 인문학도를 위한 통합 가이드
  github: https://github.com/ddokbaro/DHTextBook

# PDF export 설정
  exports:
    - id: dh-textbook-pdf
      format: typst
      output: exports/dh-textbook.pdf
      fontstyle: "Noto Sans CJK KR"
      fontsize: 10
      linespacing: 1.25
      show_ToC: true
      # ⚠️ 주의: 정상 작동 파일에 있던 template: templates/plain_typst_book 은 
      # 현재 프로젝트 폴더에 templates 폴더가 없다면 에러가 나므로 꼭 빼거나 주석 처리하세요!

  # 👇 PDF 다운로드 항목으로 노출 (정상 파일과 동일하게 롤백)
  downloads:
    - id: dh-textbook-pdf
      title: "PDF 다운로드"
      filename: "dh-textbook.pdf"


site:
  template: book-theme
  logo: logo.png

  # (여기에 있던 downloads는 위로 옮겼으므로 삭제합니다)
      
  actions:
    - title: Open in Colab
      icon: rocket
      url: https://colab.research.google.com/github/ddokbaro/DHTextBook/blob/main/
      static: true
      
  options:
    numbered_chapters: true